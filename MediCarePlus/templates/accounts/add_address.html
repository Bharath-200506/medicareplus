{% extends 'base.html' %}
{% block title %}Add Address - MediCarePlus{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-primary text-white py-3 rounded-top-4">
                    <h5 class="fw-bold mb-0"><i class="bi bi-geo-alt me-2"></i>Add New Address</h5>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Full Name</label>
                                {{ form.full_name }}
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Phone Number</label>
                                {{ form.phone }}
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Street Address</label>
                                {{ form.street }}
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">City</label>
                                {{ form.city }}
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">State</label>
                                {{ form.state }}
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">PIN Code</label>
                                {{ form.pincode }}
                            </div>
                            <div class="col-12">
                                <div class="form-check">
                                    {{ form.is_default }}
                                    <label class="form-check-label fw-semibold" for="{{ form.is_default.id_for_label }}">
                                        Set as default address
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div class="d-flex gap-3 mt-4">
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check me-1"></i>Save Address
                            </button>
                            <a href="{% url 'accounts:profile' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
