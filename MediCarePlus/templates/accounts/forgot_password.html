{% extends 'base.html' %}
{% block title %}Forgot Password - MediCarePlus{% endblock %}

{% block content %}
<div class="min-vh-100 d-flex align-items-center bg-light py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow-lg rounded-4">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <div class="rounded-circle bg-warning-soft mx-auto d-flex align-items-center justify-content-center mb-3" style="width:70px;height:70px;">
                                <i class="bi bi-lock text-warning fs-2"></i>
                            </div>
                            <h3 class="fw-bold">Forgot Password?</h3>
                            <p class="text-muted">Enter your registered email to receive a password reset link.</p>
                        </div>
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-envelope text-muted"></i></span>
                                    <input type="email" name="email" class="form-control" placeholder="your@email.com" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 btn-lg">
                                <i class="bi bi-send me-2"></i>Send Reset Link
                            </button>
                        </form>
                        <hr class="my-4">
                        <p class="text-center text-muted mb-0">
                            Remember your password? <a href="{% url 'accounts:login' %}" class="text-primary fw-semibold">Sign In</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
